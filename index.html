<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="%BRAND_TAGLINE%" />
    <title>%BRAND_NAME% — %BRAND_TAGLINE%</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-mark" aria-hidden="true"></div>
      <div class="boot-name">%BRAND_NAME%</div>
      <div class="boot-tag">%BRAND_TAGLINE%</div>
    </div>
    <div id="app"></div>
    <noscript>%BRAND_NAME% needs JavaScript to draw the map.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
